<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Déposer un devoir</title>
  <meta name="theme-color" content="#2e46c2">
  <link rel="icon" href="/assets/chameleon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f6f1e9; --ink: #1b2033; --muted: #6b7084; --blue: #2e46c2; --green: #3f9e6a; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; overflow: hidden; }
    button, label { font: inherit; border: 0; cursor: pointer; }
    [hidden] { display: none !important; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }

    /* 1. Prendre la photo : tout l'écran est le bouton */
    .shoot { flex: 1; border-radius: 32px; background: var(--blue); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; box-shadow: 0 24px 50px -24px rgba(46, 70, 194, .7); }
    .shoot:active { transform: scale(.985); }
    .shoot .cam { width: 132px; height: 132px; border-radius: 50%; background: rgba(255, 255, 255, .16); display: grid; place-items: center; }
    .shoot .cam svg { width: 64px; height: 64px; }
    .shoot b { font-size: 30px; font-weight: 700; }
    .shoot img { width: 120px; }

    /* 2. Vérifier puis envoyer */
    .pages { flex: 1; min-height: 0; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
    .pages .pg { position: relative; flex: 0 0 auto; height: 100%; scroll-snap-align: center; }
    .pages .pg img { height: 100%; max-width: calc(100vw - 80px); object-fit: contain; border-radius: 22px; background: #fff; box-shadow: 0 16px 40px -20px rgba(27, 32, 51, .45); display: block; }
    .pages .pg .del { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; background: rgba(27, 32, 51, .6); color: #fff; font-size: 22px; line-height: 40px; }
    .pages .add { flex: 0 0 96px; border-radius: 22px; border: 2px dashed #cfc6b4; background: transparent; color: var(--muted); font-size: 44px; font-weight: 300; }
    .send { margin-top: 16px; height: 92px; border-radius: 28px; background: var(--blue); color: #fff; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 14px; position: relative; overflow: hidden; }
    .send svg { width: 30px; height: 30px; }
    .send .bar { position: absolute; left: 0; bottom: 0; height: 6px; background: rgba(255, 255, 255, .7); width: 0; transition: width .2s; }
    .send:disabled { opacity: .85; }

    /* 3. Envoyé */
    .done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
    .done img { width: 240px; animation: hop .9s ease-in-out 3; }
    .done .ok { width: 84px; height: 84px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; }
    .done .ok svg { width: 44px; height: 44px; }
    .done h1 { font-family: "Newsreader", Georgia, serif; font-weight: 400; font-size: 40px; margin: 0; }
    .again { margin-top: 10px; height: 64px; padding: 0 30px; border-radius: 20px; background: #fff; color: var(--ink); font-size: 18px; font-weight: 600; box-shadow: 0 10px 30px -18px rgba(27, 32, 51, .5); }
    .err { color: #a33a22; text-align: center; font-size: 15px; margin-top: 10px; }
    @keyframes hop { 50% { transform: translateY(-10px); } }
  </style>
</head>
<body>
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>

  <section class="screen" id="s-shoot">
    <label class="shoot" for="cam">
      <img src="/assets/chameleon.svg" alt="">
      <span class="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <b>Prendre la photo</b>
    </label>
  </section>

  <section class="screen" id="s-check" hidden>
    <div class="pages" id="pages"></div>
    <p class="err" id="err" hidden></p>
    <button class="send" id="send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span id="send-lbl">Envoyer</span><span class="bar" id="bar"></span>
    </button>
  </section>

  <section class="screen" id="s-done" hidden>
    <div class="done">
      <img src="/assets/chameleon.svg" alt="">
      <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>Envoyé</h1>
      <button class="again" id="again">Nouveau devoir</button>
    </div>
  </section>

  <script>
    "use strict";
    const $ = (s) => document.querySelector(s);
    const subject = new URLSearchParams(location.search).get("m") || "";
    const session = Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
    let pages = [];

    const show = (id) => ["s-shoot", "s-check", "s-done"].forEach((s) => ($("#" + s).hidden = s !== id));
    const error = (msg) => { $("#err").textContent = msg; $("#err").hidden = !msg; };

    async function compress(file, max = 2000) {
      try {
        const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
        const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
        const c = document.createElement("canvas");
        c.width = Math.round(bmp.width * k);
        c.height = Math.round(bmp.height * k);
        c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
        return await new Promise((r) => c.toBlob(r, "image/jpeg", 0.86));
      } catch {
        return file;
      }
    }

    function drawPages() {
      $("#pages").innerHTML = pages.map((p, i) => `<div class="pg"><img src="${p.preview}" alt="Page ${i + 1}"><button class="del" data-i="${i}" aria-label="Retirer">×</button></div>`).join("")
        + `<label class="add" for="cam" aria-label="Ajouter une page" style="display:grid;place-items:center">+</label>`;
      const last = $("#pages .pg:last-of-type");
      last?.scrollIntoView({ inline: "center" });
    }

    $("#cam").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      const blob = await compress(file);
      pages.push({ blob, preview: URL.createObjectURL(blob) });
      error("");
      drawPages();
      show("s-check");
    });

    $("#pages").addEventListener("click", (e) => {
      const d = e.target.closest(".del");
      if (!d) return;
      pages.splice(+d.dataset.i, 1);
      pages.length ? drawPages() : show("s-shoot");
    });

    function upload(blob, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", `/api/upload?s=${session}`);
        xhr.setRequestHeader("content-type", blob.type || "image/jpeg");
        xhr.upload.onprogress = (ev) => ev.lengthComputable && onProgress(ev.loaded / ev.total);
        xhr.onload = () => (xhr.status < 300 ? resolve(JSON.parse(xhr.responseText).url) : reject());
        xhr.onerror = reject;
        xhr.send(blob);
      });
    }

    $("#send").addEventListener("click", async () => {
      if (!pages.length) return;
      const btn = $("#send");
      btn.disabled = true;
      $("#send-lbl").textContent = "Envoi…";
      error("");
      try {
        const files = [];
        for (let i = 0; i < pages.length; i++) {
          const url = await upload(pages[i].blob, (p) => ($("#bar").style.width = ((i + p) / pages.length) * 100 + "%"));
          files.push({ url, pdf: false });
        }
        const r = await fetch("/api/devoir", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ files, subject }) });
        if (!r.ok) throw new Error();
        pages = [];
        show("s-done");
      } catch {
        error("L'envoi n'a pas marché. Réessaie.");
      } finally {
        btn.disabled = false;
        $("#send-lbl").textContent = "Envoyer";
        $("#bar").style.width = 0;
      }
    });

    $("#again").addEventListener("click", () => show("s-shoot"));
  </script>
</body>
</html>
